name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  DOTNET_VERSION: 8.0.x
  REGISTRY: ghcr.io
  SOLUTION_FILE: CinemaManagementSystem.sln
  TEST_PROJECT: Cinema.Tests/Cinema.Tests.csproj

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      - name: Build
        run: dotnet build "${{ env.SOLUTION_FILE }}" --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test "${{ env.TEST_PROJECT }}"
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  docker-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build-test

    outputs:
      image: ${{ steps.image.outputs.image }}
      tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          image="${REGISTRY}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "tag=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "Using image ${image}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    needs: docker-image
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: staging

    permissions:
      contents: read
      packages: read

    env:
      IMAGE: ${{ needs.docker-image.outputs.image }}:${{ needs.docker-image.outputs.tag }}
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      STAGING_APP_DIR: ${{ vars.STAGING_APP_DIR }}
      STAGING_WEB_HOST_PORT: ${{ vars.STAGING_WEB_HOST_PORT }}
      STAGING_ASPNETCORE_ENVIRONMENT: ${{ vars.STAGING_ASPNETCORE_ENVIRONMENT }}
      STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
      STAGING_CONNECTION_STRING: ${{ secrets.STAGING_CONNECTION_STRING }}
      STAGING_GOOGLE_CLIENT_ID: ${{ secrets.STAGING_GOOGLE_CLIENT_ID }}
      STAGING_GOOGLE_CLIENT_SECRET: ${{ secrets.STAGING_GOOGLE_CLIENT_SECRET }}
      STAGING_VNPAY_TMN_CODE: ${{ secrets.STAGING_VNPAY_TMN_CODE }}
      STAGING_VNPAY_HASH_SECRET: ${{ secrets.STAGING_VNPAY_HASH_SECRET }}
      STAGING_VNPAY_BASE_URL: ${{ secrets.STAGING_VNPAY_BASE_URL }}
      STAGING_VNPAY_RETURN_URL: ${{ secrets.STAGING_VNPAY_RETURN_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate staging configuration
        shell: bash
        run: |
          required=(
            STAGING_HOST
            STAGING_USER
            STAGING_SSH_KEY
            STAGING_CONNECTION_STRING
            STAGING_GOOGLE_CLIENT_ID
            STAGING_GOOGLE_CLIENT_SECRET
            STAGING_VNPAY_TMN_CODE
            STAGING_VNPAY_HASH_SECRET
            STAGING_VNPAY_BASE_URL
            STAGING_VNPAY_RETURN_URL
          )

          missing=0
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is required for staging deploy."
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

          echo "STAGING_PORT=${STAGING_PORT:-22}" >> "${GITHUB_ENV}"
          echo "STAGING_APP_DIR=${STAGING_APP_DIR:-/opt/cinema-management-system}" >> "${GITHUB_ENV}"
          echo "STAGING_WEB_HOST_PORT=${STAGING_WEB_HOST_PORT:-8080}" >> "${GITHUB_ENV}"
          echo "STAGING_ASPNETCORE_ENVIRONMENT=${STAGING_ASPNETCORE_ENVIRONMENT:-Staging}" >> "${GITHUB_ENV}"

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${STAGING_SSH_KEY}" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -p "${STAGING_PORT}" "${STAGING_HOST}" >> ~/.ssh/known_hosts

      - name: Copy compose file
        shell: bash
        run: |
          ssh -i ~/.ssh/staging_key -p "${STAGING_PORT}" "${STAGING_USER}@${STAGING_HOST}" \
            "mkdir -p '${STAGING_APP_DIR}'"

          scp -i ~/.ssh/staging_key -P "${STAGING_PORT}" \
            deploy/docker-compose.staging.yml \
            "${STAGING_USER}@${STAGING_HOST}:${STAGING_APP_DIR}/docker-compose.yml"

      - name: Write staging environment
        shell: bash
        run: |
          umask 077
          cat > staging.env <<EOF
          WEB_IMAGE=${IMAGE}
          WEB_HOST_PORT=${STAGING_WEB_HOST_PORT}
          ASPNETCORE_ENVIRONMENT=${STAGING_ASPNETCORE_ENVIRONMENT}
          ASPNETCORE_URLS=http://+:8080
          ConnectionStrings__DefaultConnection=${STAGING_CONNECTION_STRING}
          Authentication__Google__ClientId=${STAGING_GOOGLE_CLIENT_ID}
          Authentication__Google__ClientSecret=${STAGING_GOOGLE_CLIENT_SECRET}
          VnPay__TmnCode=${STAGING_VNPAY_TMN_CODE}
          VnPay__HashSecret=${STAGING_VNPAY_HASH_SECRET}
          VnPay__BaseUrl=${STAGING_VNPAY_BASE_URL}
          VnPay__ReturnUrl=${STAGING_VNPAY_RETURN_URL}
          EOF

          sed -i 's/^          //' staging.env

          scp -i ~/.ssh/staging_key -P "${STAGING_PORT}" \
            staging.env \
            "${STAGING_USER}@${STAGING_HOST}:${STAGING_APP_DIR}/.env"

      - name: Pull and restart staging
        shell: bash
        run: |
          ssh -i ~/.ssh/staging_key -p "${STAGING_PORT}" "${STAGING_USER}@${STAGING_HOST}" \
            "cd '${STAGING_APP_DIR}' && docker login ghcr.io -u '${{ github.actor }}' --password-stdin && docker compose pull cinema-web && docker compose up -d --remove-orphans cinema-web && docker image prune -f" \
            <<< "${{ secrets.GITHUB_TOKEN }}"

      - name: Optional external health check
        shell: bash
        run: |
          if [ -z "${STAGING_HEALTH_URL}" ]; then
            echo "STAGING_HEALTH_URL is not set; skipping external health check."
            exit 0
          fi

          curl --fail --retry 10 --retry-delay 5 --retry-all-errors "${STAGING_HEALTH_URL}"

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: docker-image
    if: github.event_name == 'workflow_dispatch'
    environment: production

    permissions:
      contents: read
      packages: read

    env:
      IMAGE: ${{ needs.docker-image.outputs.image }}:${{ needs.docker-image.outputs.tag }}
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_PORT: ${{ secrets.PROD_PORT }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_APP_DIR: ${{ vars.PROD_APP_DIR }}
      PROD_DOMAIN: ${{ vars.PROD_DOMAIN }}
      PROD_CONNECTION_STRING: ${{ secrets.PROD_CONNECTION_STRING }}
      PROD_MSSQL_SA_PASSWORD: ${{ secrets.PROD_MSSQL_SA_PASSWORD }}
      PROD_GOOGLE_CLIENT_ID: ${{ secrets.PROD_GOOGLE_CLIENT_ID }}
      PROD_GOOGLE_CLIENT_SECRET: ${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}
      PROD_VNPAY_TMN_CODE: ${{ secrets.PROD_VNPAY_TMN_CODE }}
      PROD_VNPAY_HASH_SECRET: ${{ secrets.PROD_VNPAY_HASH_SECRET }}
      PROD_VNPAY_BASE_URL: ${{ secrets.PROD_VNPAY_BASE_URL }}
      PROD_VNPAY_RETURN_URL: ${{ secrets.PROD_VNPAY_RETURN_URL }}
      PROD_CERTBOT_EMAIL: ${{ vars.PROD_CERTBOT_EMAIL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production configuration
        shell: bash
        run: |
          required=(
            PROD_HOST
            PROD_USER
            PROD_SSH_KEY
            PROD_CONNECTION_STRING
            PROD_MSSQL_SA_PASSWORD
            PROD_GOOGLE_CLIENT_ID
            PROD_GOOGLE_CLIENT_SECRET
            PROD_VNPAY_TMN_CODE
            PROD_VNPAY_HASH_SECRET
            PROD_VNPAY_BASE_URL
            PROD_VNPAY_RETURN_URL
          )

          missing=0
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is required for production deploy."
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

          echo "PROD_PORT=${PROD_PORT:-22}" >> "${GITHUB_ENV}"
          echo "PROD_APP_DIR=${PROD_APP_DIR:-/opt/cinema-management-system}" >> "${GITHUB_ENV}"
          echo "PROD_DOMAIN=${PROD_DOMAIN:-cinema.yourdomain.com}" >> "${GITHUB_ENV}"

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${PROD_SSH_KEY}" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          ssh-keyscan -p "${PROD_PORT}" "${PROD_HOST}" >> ~/.ssh/known_hosts

      - name: Copy deployment files
        shell: bash
        run: |
          ssh -i ~/.ssh/prod_key -p "${PROD_PORT}" "${PROD_USER}@${PROD_HOST}" \
            "mkdir -p '${PROD_APP_DIR}/nginx/conf.d' '${PROD_APP_DIR}/backup'"

          scp -i ~/.ssh/prod_key -P "${PROD_PORT}" \
            deploy/docker-compose.prod.yml \
            "${PROD_USER}@${PROD_HOST}:${PROD_APP_DIR}/docker-compose.yml"

          scp -i ~/.ssh/prod_key -P "${PROD_PORT}" \
            deploy/nginx/nginx.conf \
            "${PROD_USER}@${PROD_HOST}:${PROD_APP_DIR}/nginx/nginx.conf"

          scp -i ~/.ssh/prod_key -P "${PROD_PORT}" \
            deploy/nginx/conf.d/default.conf \
            "${PROD_USER}@${PROD_HOST}:${PROD_APP_DIR}/nginx/conf.d/default.conf"

          scp -i ~/.ssh/prod_key -P "${PROD_PORT}" \
            deploy/backup/backup-db.sh \
            "${PROD_USER}@${PROD_HOST}:${PROD_APP_DIR}/backup/backup-db.sh"

          scp -i ~/.ssh/prod_key -P "${PROD_PORT}" \
            deploy/backup/restore-db.sh \
            "${PROD_USER}@${PROD_HOST}:${PROD_APP_DIR}/backup/restore-db.sh"

      - name: Write production environment
        shell: bash
        run: |
          umask 077
          cat > prod.env <<EOF
          WEB_IMAGE=${IMAGE}
          ASPNETCORE_ENVIRONMENT=Production
          ASPNETCORE_URLS=http://+:8080
          MSSQL_SA_PASSWORD=${PROD_MSSQL_SA_PASSWORD}
          MSSQL_PID=Express
          ConnectionStrings__DefaultConnection=${PROD_CONNECTION_STRING}
          Authentication__Google__ClientId=${PROD_GOOGLE_CLIENT_ID}
          Authentication__Google__ClientSecret=${PROD_GOOGLE_CLIENT_SECRET}
          VnPay__TmnCode=${PROD_VNPAY_TMN_CODE}
          VnPay__HashSecret=${PROD_VNPAY_HASH_SECRET}
          VnPay__BaseUrl=${PROD_VNPAY_BASE_URL}
          VnPay__ReturnUrl=${PROD_VNPAY_RETURN_URL}
          DOMAIN_NAME=${PROD_DOMAIN}
          CERTBOT_EMAIL=${PROD_CERTBOT_EMAIL}
          BACKUP_RETENTION_DAYS=7
          EOF

          sed -i 's/^          //' prod.env

          scp -i ~/.ssh/prod_key -P "${PROD_PORT}" \
            prod.env \
            "${PROD_USER}@${PROD_HOST}:${PROD_APP_DIR}/.env.prod"

      - name: Pull and restart production
        shell: bash
        run: |
          ssh -i ~/.ssh/prod_key -p "${PROD_PORT}" "${PROD_USER}@${PROD_HOST}" \
            "cd '${PROD_APP_DIR}' && docker login ghcr.io -u '${{ github.actor }}' --password-stdin && docker compose pull cinema-web && docker compose up -d --remove-orphans && docker image prune -f" \
            <<< "${{ secrets.GITHUB_TOKEN }}"

      - name: Production health check
        shell: bash
        run: |
          echo "Waiting for production to become healthy..."
          curl --fail --retry 15 --retry-delay 10 --retry-all-errors \
            "https://${PROD_DOMAIN}/healthz/ready"

