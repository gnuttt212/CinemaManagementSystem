groups:
  - name: cinema-alerts
    rules:
      # High HTTP 5xx error rate
      - alert: HighErrorRate
        expr: rate(http_requests_received_total{code=~"5.."}[5m]) / rate(http_requests_received_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "More than 5% of requests are returning 5xx errors for the last 5 minutes."

      # High response time (P95 > 2 seconds)
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time (P95 > 2s)"
          description: "95th percentile response time is above 2 seconds for the last 5 minutes."

      # Application down
      - alert: AppDown
        expr: up{job="cinema-web"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Cinema web application is down"
          description: "The cinema-web target has been unreachable for more than 1 minute."

      # High memory usage (> 500MB)
      - alert: HighMemoryUsage
        expr: dotnet_total_memory_bytes > 500 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High .NET memory usage (> 500MB)"
          description: "The application is using more than 500MB of memory for the last 10 minutes."
