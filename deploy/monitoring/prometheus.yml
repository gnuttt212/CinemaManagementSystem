global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerting-rules.yml"

scrape_configs:
  - job_name: "cinema-web"
    metrics_path: /metrics
    static_configs:
      - targets: ["cinema-web:8080"]
        labels:
          app: "cinema-management-system"
          environment: "production"

  - job_name: "nginx"
    metrics_path: /stub_status
    static_configs:
      - targets: ["cinema-nginx:80"]
