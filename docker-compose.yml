services:
  cinema-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cinema-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-CinemaDev@12345}
    ports:
      - "${MSSQL_HOST_PORT:-14333}:1433"
    volumes:
      - cinema-sql-data:/var/opt/mssql
    networks:
      - cinema-net

  cinema-db-init:
    image: mcr.microsoft.com/mssql-tools:latest
    container_name: cinema-db-init
    depends_on:
      - cinema-db
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-CinemaDev@12345}
    volumes:
      - ./DatabaseScripts/CinemaManagementSystem_Full.sql:/scripts/CinemaManagementSystem_Full.sql:ro
    networks:
      - cinema-net
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then SQLCMD="/opt/mssql-tools18/bin/sqlcmd"; SQLCMD_ARGS="-C"; else SQLCMD="/opt/mssql-tools/bin/sqlcmd"; SQLCMD_ARGS=""; fi
        echo "Waiting for SQL Server..."
        for i in {1..60}; do
          if $$SQLCMD -S cinema-db,1433 -U sa -P "$$MSSQL_SA_PASSWORD" $$SQLCMD_ARGS -Q "SELECT 1" >/dev/null 2>&1; then echo "SQL Server is ready."; break; fi
          if [ "$$i" = "60" ]; then echo "SQL Server did not become ready in time."; exit 1; fi
          sleep 2
        done
        if $$SQLCMD -S cinema-db,1433 -U sa -P "$$MSSQL_SA_PASSWORD" $$SQLCMD_ARGS -Q "SET NOCOUNT ON; IF DB_ID(N'QuanLyRapPhim') IS NULL RAISERROR('not init', 16, 1);" >/dev/null 2>&1 \
          && $$SQLCMD -S cinema-db,1433 -U sa -P "$$MSSQL_SA_PASSWORD" $$SQLCMD_ARGS -d QuanLyRapPhim -Q "SET NOCOUNT ON; IF OBJECT_ID(N'dbo.Phim', N'U') IS NULL RAISERROR('not init', 16, 1);" >/dev/null 2>&1; then
          echo "Database already initialized."; exit 0
        fi
        echo "Applying database script..."
        $$SQLCMD -S cinema-db,1433 -U sa -P "$$MSSQL_SA_PASSWORD" $$SQLCMD_ARGS -i /scripts/CinemaManagementSystem_Full.sql
        echo "Database initialized."

  cinema-redis:
    image: redis:7-alpine
    container_name: cinema-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data-dev:/data
    networks:
      - cinema-net
    restart: unless-stopped

  cinema-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cinema-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - cinema-net
    restart: unless-stopped

  cinema-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: cinema-management-web:dev
    container_name: cinema-web
    depends_on:
      cinema-db-init:
        condition: service_completed_successfully
      cinema-redis:
        condition: service_started
      cinema-rabbitmq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=cinema-db,1433;Database=QuanLyRapPhim;User Id=sa;Password=${MSSQL_SA_PASSWORD:-CinemaDev@12345};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True"
      ConnectionStrings__Redis: "cinema-redis:6379"
      ConnectionStrings__RabbitMQ: "amqp://guest:guest@cinema-rabbitmq:5672/"
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-PLACEHOLDER_CLIENT_ID}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-PLACEHOLDER_CLIENT_SECRET}
      VnPay__TmnCode: ${VNPAY_TMN_CODE:-PLACEHOLDER_TMN_CODE}
      VnPay__HashSecret: ${VNPAY_HASH_SECRET:-PLACEHOLDER_HASH_SECRET}
      VnPay__BaseUrl: ${VNPAY_BASE_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VnPay__ReturnUrl: ${VNPAY_RETURN_URL:-http://localhost:8080/HoaDon/VnPayReturn}
    ports:
      - "${WEB_HOST_PORT:-8080}:8080"
    volumes:
      - cinema-poster-data:/app/wwwroot/images/phim
    networks:
      - cinema-net
    restart: unless-stopped

volumes:
  cinema-sql-data:
  cinema-poster-data:
  redis-data-dev:

networks:
  cinema-net:
    driver: bridge
